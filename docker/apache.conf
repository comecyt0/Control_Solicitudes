# Seguridad: ocultar versión de Apache
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    DocumentRoot /var/www/html
    ServerName localhost

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/comecyt_error.log
    CustomLog ${APACHE_LOG_DIR}/comecyt_access.log combined
</VirtualHost>
