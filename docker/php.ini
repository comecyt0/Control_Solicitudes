; PHP Configuration para COMECyT en Docker
; archivo: docker/php.ini

[PHP]
; Zona horaria
date.timezone = America/Mexico_City

; Límites de memoria y uploads
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 120
max_input_time = 120

; Errores (desarrollo: On, producción: Off)
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /var/log/php_errors.log

; Sesiones
session.gc_maxlifetime = 7200
session.cookie_httponly = 1
session.use_strict_mode = 1

; Charset
default_charset = "UTF-8"
mbstring.internal_encoding = UTF-8

; ──────────────────────────────────────────────
; Optimizaciones de Rendimiento (Producción)
; ──────────────────────────────────────────────
; Configuración de caché de rutas (mitiga la latencia de archivos en WSL2/Docker)
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Activar OPcache
[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 0
opcache.validate_timestamps = 0
opcache.fast_shutdown = 1
opcache.save_comments = 1
